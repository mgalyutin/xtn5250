plugins {
    id 'java-library'
    id 'maven-publish'
    // id 'org.openrewrite.rewrite' version '7.1.5'
}

group = 'net.infordata'
version = '1.0.2'

publishing {
    repositories {
        maven {
            url DISO21_THIRD_PARTY_REPOSITORY
            credentials {
                username "$nexusUserName"
                password "$nexusUserPassword"
            }
        }
    }
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
//    publications {
//        maven(MavenPublication) {
//            version = "${project.version}-${project.extensions.buildNumber.get()}"
//            artifact distZip
//        }
//    }
}



java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}


repositories {
    maven {
        url DISO21_THIRD_PARTY_REPOSITORY
        credentials {
            username "$nexusUserName"
            password "$nexusUserPassword"
        }
    }
    maven {
        url DISO21_M2CENTRAL
        credentials {
            username "$nexusUserName"
            password "$nexusUserPassword"
        }
    }
    //  mavenCentral()
}
