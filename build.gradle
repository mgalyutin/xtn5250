dependencies {
    // implementation 'org.openrewrite:rewrite-javascript:8.37.3'
    // implementation 'org.openrewrite:rewrite-logging:8.37.3'
    implementation 'org.slf4j:slf4j-api:2.0.16'

    compileOnly 'com.google.guava:guava:18.0'
    compileOnly 'org.jetbrains:annotations:26.0.1'


    // testImplementation platform('org.junit:junit-bom:5.10.0')
    // testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'junit:junit:4.13.1'
    testImplementation 'us.abstracta:wiresham:0.2.1'
    testImplementation 'org.assertj:assertj-swing:3.9.2'
    testImplementation 'org.assertj:assertj-core:3.10.0'
}

test {
    useJUnitPlatform()
}
